services:
  - type: web
    name: wiltrader-journal
    env: node
    region: oregon
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 3000
    autoDeploy: true
